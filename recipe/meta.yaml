{% set name = "topometry" %}
{% set version = "1.1.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/topometry-{{ version }}.tar.gz
  sha256: f0d4a90c53c7e8701aaaa5a99e45b63e5c63e3b86779cea44eaf445a371b78e7

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python >=3.6
    - setuptools >=42
    - wheel
    - pip
  run:
    - python >=3.6
    - numpy
    - scipy
    - scikit-learn
    - matplotlib-base
    - pandas
    - numba
    - setuptools

test:
  imports:
    - topo
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/davisidarta/topometry
  summary: A comprehensive dimensional reduction framework to recover latent information from data.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - mfansler
